# Packaging for Windows 10/11 and macOS (spec §3.1, §3.3).
#
# Both platforms are built from the same sources; nothing here forks product
# behaviour. Signing credentials come from CI secrets and are never in the repo.
appId: com.vcwriter.desktop
productName: VC Writer
copyright: Copyright © VC Writer

directories:
  output: release
  buildResources: build

# Two 1024px PNGs cut from the icon artwork by brand/logo/icons.mjs;
# electron-builder derives the .ico and .icns from them at package time. They
# differ because the platforms do: Windows draws icons square, and the macOS
# Dock draws rounded tiles with transparent corners, so the Mac one sits the
# artwork inside a black rounded tile rather than letting a mask clip the
# frame. Regenerate with `node brand/logo/icons.mjs`.
icon: build/icon.png

files:
  - out/**
  - package.json

# The natural voices' engine (addendum 45) is a native library. It has to sit
# outside the app archive to load, and the package carries a build for every
# platform, so each installer keeps only its own (about 35 MB rather than 250).
# The open-source credits and licence texts (addendum 45 §4), written by
# scripts/credits.mjs, ride along beside the program as resources/licenses.
extraResources:
  - from: licenses
    to: licenses

asarUnpack:
  - '**/node_modules/onnxruntime-node/**'

# Installers are uploaded to the private release bucket by CI and handed out as
# short-lived signed URLs, so electron-builder itself publishes nothing.
publish: null

fileAssociations:
  - ext: vcw
    name: VC Writer project
    role: Editor

win:
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/linux/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/darwin/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**'
  target:
    - target: nsis
      arch: [x64]
  # One name per release, so the bucket key, the checksum line and the file a
  # writer finds in Downloads all say the same thing (addendum 41 §2).
  artifactName: VC-Writer-${version}-Setup.${ext}
  # **No space in the program's file name** (addendum 41 §6). electron-builder
  # 25 hands the path to Azure's signing tool unquoted, so `VC Writer.exe`
  # arrived as `…\VC` and `Writer.exe` and the tool reported the file missing.
  # The name people see — Start menu, taskbar, Add or remove programs — is
  # still productName, "VC Writer"; only the file on disk changes.
  executableName: VCWriter
  # Windows Authenticode signing (§3.3). Credentials come from CI environment
  # variables — Azure Artifact Signing, or CSC_LINK / CSC_KEY_PASSWORD for an
  # older certificate — rather than anything committed here.
  signtoolOptions:
    signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true

mac:
  icon: build/icon-mac.png
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/linux/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/win32/**'
  # The universal build merges an Intel and an Apple silicon copy of the app.
  # The voice engine already ships both architectures side by side, identical
  # in each copy, so they are kept as they are rather than merged.
  x64ArchFiles: '**/node_modules/onnxruntime-node/bin/**'
  category: public.app-category.productivity
  # **One universal installer** (addendum 41 §2): the release catalogue keeps
  # one build per platform, the download route hands out one file, and the
  # updater opens one .dmg — so a Mac build that came out as two, Apple silicon
  # and Intel, had nowhere to put the second. A universal binary runs natively
  # on both and is the one a writer cannot download wrongly.
  target:
    - target: dmg
      arch: [universal]
  artifactName: VC-Writer-${version}-mac.${ext}
  # Minimum macOS version stays configurable per §18; 11.0 covers Apple silicon
  # from the first shipping hardware.
  minimumSystemVersion: '11.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Notarization is switched on from the command line rather than here, because a
# build machine without Apple credentials must still be able to produce an
# unsigned build for testing. CI adds `-c.mac.notarize=true` only when the
# credentials are present; see docs/code-signing.md.
